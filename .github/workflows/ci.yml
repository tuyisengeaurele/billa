name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billa_test
      JWT_ACCESS_SECRET: ci-test-secret
      JWT_REFRESH_TTL: 30d
      JWT_ACCESS_TTL: 15m
      UPLOADS_DIR: ./uploads-test
      REMBG_SERVICE_URL: http://localhost:8000/remove-background

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma migrate deploy
        working-directory: server

      - run: npm run typecheck --workspace=shared
      - run: npm run typecheck --workspace=server
      - run: npm run typecheck --workspace=client

      - run: npm run test --workspace=shared
      - run: npm run test --workspace=server
      - run: npm run test --workspace=client

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/billa
      CLIENT_ORIGIN: http://localhost:5173
      JWT_ACCESS_SECRET: ci-e2e-secret
      JWT_REFRESH_TTL: 30d
      JWT_ACCESS_TTL: 15m
      UPLOADS_DIR: ./uploads-e2e
      REMBG_SERVICE_URL: http://localhost:8000/remove-background

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run prisma:generate

      - run: npx prisma migrate deploy
        working-directory: server

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npx playwright test
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
