<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#c2185b" />
    <title>Billa is offline</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #27272a;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #131315; color: #e4e4e7; }
      }
      main { max-width: 22rem; padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 1.25rem; line-height: 1.5; color: #71717a; }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: #c2185b;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1.25rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Billa needs a connection to load. Check your data or Wi-Fi and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
